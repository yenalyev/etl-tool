spring:
  application:
    name: etl-tool

  datasource:
    url: jdbc:sqlite:${user.home}/.etl/metadata.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10  # ✅ Збільшено для Spring Batch

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false  # ✅ Вимкнено для batch (багато SQL)

  batch:
    jdbc:
      initialize-schema: always  # ✅ Створить Spring Batch таблиці
    job:
      enabled: false  # ✅ Не автостарт - керуємо вручну через API

server:
  port: 8081

# Налаштування логування
logging:
  level:
    com.etl.etltool: INFO
    org.springframework.batch: INFO
    org.hibernate: WARN
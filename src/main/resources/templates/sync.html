<div th:fragment="content">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold">Синхронізація даних</h2>
            <button onclick="runSync()" id="btnSync" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold shadow-lg">
                Запустити імпорт
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
                <div class="text-xs text-slate-500 uppercase mb-2">Нових записів</div>
                <div id="stat-added" class="text-3xl font-black text-green-400">0</div>
            </div>
        </div>

        <div class="bg-black rounded-xl p-6 font-mono text-xs text-blue-300 h-64 overflow-y-auto border border-slate-800" id="syncLogs">
            <div class="text-slate-600 italic">> Система готова до синхронізації...</div>
        </div>
    </div>

    <script>
        async function runSync() {
    const btn = document.getElementById('btnSync');
    const logs = document.getElementById('syncLogs');
    const statAdded = document.getElementById('stat-added');

    btn.disabled = true;
    btn.innerHTML = 'Завантаження...';

    // Додаємо стартовий лог
    const logEntry = (text, type = 'info') => {
        const div = document.createElement('div');
        div.className = type === 'error' ? 'text-red-500' : 'text-blue-300';
        div.innerHTML = `<span class="text-slate-600">[${new Date().toLocaleTimeString()}]</span> > ${text}`;
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
    };

    logEntry('Ініціалізація імпорту...');

    try {
        const response = await fetch('/api/sync/run', { method: 'POST' });
        const result = await response.json();

        if (result.success) {
            result.logs.forEach(l => logEntry(l));
            statAdded.innerText = result.addedCount;
            logEntry('✅ Успішно завершено!', 'info');
        } else {
            logEntry('❌ ' + result.message, 'error');
        }
    } catch (e) {
        logEntry('❌ Помилка мережі', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Запустити імпорт';
    }
}
    </script>
</div>

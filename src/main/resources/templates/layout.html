<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-[#0f172a] text-slate-200 font-sans h-screen flex overflow-hidden">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="flex-1 flex flex-col overflow-hidden">

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="flex-1 overflow-y-auto p-8 bg-slate-900">
        <div th:replace="~{__${content}__}"></div>
    </main>

</div>

<div id="fileModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-2xl rounded-3xl flex flex-col max-h-[80vh] overflow-hidden shadow-2xl">
        <div class="p-6 border-b border-gray-700 flex justify-between items-center text-blue-400">
            <h3 class="font-bold">📁 Файлова система</h3>
            <button onclick="closeFileBrowser()" class="text-xl">✕</button>
        </div>
        <div id="fileBreadcrumbs" class="px-6 py-2 bg-gray-950 text-[10px] text-gray-500 font-mono italic"></div>
        <div id="fileList" class="flex-1 overflow-y-auto p-4"></div>
    </div>
</div>

<script>
    // Автоматичне оновлення заголовка в хедері
    document.addEventListener("DOMContentLoaded", () => {
        const path = window.location.pathname;
        const titleEl = document.getElementById('current-screen-title');
        if (path === '/') titleEl.innerText = 'Configuration';
        if (path === '/sync') titleEl.innerText = 'Data Sync';
    });
</script>

<script th:if="${param.success}">
    const toast = document.createElement('div');
    toast.className = "fixed bottom-8 right-8 bg-green-600 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] animate-bounce font-bold";
    toast.innerText = "✅ Налаштування збережено!";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
</script>

</body>
</html>

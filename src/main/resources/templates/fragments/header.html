<header th:fragment="header" class="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-[#0f172a]/50 backdrop-blur-md sticky top-0 z-40">

  <div class="flex items-center gap-2 text-sm">
    <span class="text-slate-500">System</span>
    <span class="text-slate-700">/</span>
    <span class="text-blue-400 font-medium" id="current-screen-name">Dashboard</span>
  </div>

  <div class="flex items-center gap-6">
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/50 border border-slate-800">
      <div id="status-dot-google" class="w-2 h-2 rounded-full bg-slate-600 animate-pulse"></div>
      <span class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Google API</span>
    </div>

    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/50 border border-slate-800">
      <div id="status-dot-db" class="w-2 h-2 rounded-full bg-slate-600 animate-pulse"></div>
      <span class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Database</span>
    </div>

    <div class="h-8 w-px bg-slate-800 mx-2"></div>
    <button class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition-colors">
      <span class="text-xs">👤</span>
    </button>
  </div>
</header>

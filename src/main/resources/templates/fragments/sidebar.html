<aside th:fragment="sidebar" class="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col h-full">
    <div class="p-6 border-b border-slate-800">
        <h1 class="text-lg font-bold text-white tracking-tight">ETL Tool</h1>
    </div>
    <nav class="flex-1 py-6">
        <a th:href="@{/}"
           class="sidebar-link flex items-center gap-3 px-6 py-3 text-slate-400 hover:text-white transition-all text-sm mb-1"
           th:classappend="${currentUri == '/' ? 'active' : ''}">
            <span>⚙️</span> Налаштування
        </a>

        <a th:href="@{/sync}"
           class="sidebar-link flex items-center gap-3 px-6 py-3 text-slate-400 hover:text-white transition-all text-sm"
           th:classappend="${currentUri == '/sync' ? 'active' : ''}">
            <span>🔄</span> Синхронізація
        </a>
    </nav>
</aside>

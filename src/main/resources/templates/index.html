<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="max-w-6xl mx-auto">

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h2 class="text-3xl font-bold text-white">Dashboard</h2>
                <p class="text-slate-400 mt-1">Керування задачами синхронізації</p>
            </div>
            <div class="flex gap-4">
                <a th:href="@{/settings}" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold border border-slate-600">
                    ⚙️ Налаштування
                </a>
                <a th:href="@{/task/new}" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold shadow-lg shadow-blue-900/20 active:scale-95">
                    ➕ Нова задача
                </a>
            </div>
        </div>

        <div th:if="${param.saved}" class="mb-6 p-4 bg-green-900/20 border border-green-800 rounded-xl text-green-400">✅ Налаштування збережено!</div>
        <div th:if="${param.deleted}" class="mb-6 p-4 bg-yellow-900/20 border border-yellow-800 rounded-xl text-yellow-400">🗑️ Задачу видалено.</div>

        <div class="grid gap-6">
            <div th:each="task : ${tasks}" th:id="'task-card-' + ${task.id}"
                 class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden transition-all duration-300">

                <div class="p-6 flex justify-between items-start relative z-10 bg-slate-800">
                    <div class="flex items-start gap-4">
                        <div class="p-3 bg-gradient-to-br from-purple-900/40 to-blue-900/40 border border-white/10 rounded-xl text-2xl shadow-inner">
                            📊
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-white mb-2 flex items-center gap-3">
                                <span th:text="${task.taskName}">Task Name</span>
                                <span th:id="'status-badge-' + ${task.id}"
                                      class="px-2 py-0.5 rounded text-[10px] uppercase font-bold bg-slate-700 text-slate-400 border border-slate-600">
                                    IDLE
                                </span>
                            </h3>

                            <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-6 text-sm text-slate-400">
                                <div class="flex items-center gap-2" title="Google Sheet">
                                    <span class="text-orange-400 font-mono text-xs bg-orange-900/10 px-1.5 py-0.5 rounded border border-orange-900/20">Sheet</span>
                                    <span class="text-white" th:text="${task.sheetName ?: 'Default'}">Sheet1</span>
                                </div>
                                <div class="hidden sm:block text-slate-700">➜</div>
                                <div class="flex items-center gap-2" title="Database Table">
                                    <span class="text-green-400 font-mono text-xs bg-green-900/10 px-1.5 py-0.5 rounded border border-green-900/20">DB</span>
                                    <span class="font-bold text-white" th:text="${task.targetTableName}">table</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button th:onclick="'toggleRun(' + ${task.id} + ')'"
                                th:id="'btn-run-' + ${task.id}"
                                title="Запустити"
                                class="p-2 bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white rounded-lg transition-colors border border-blue-500/30">
                            ▶️ Run
                        </button>

                        <a th:href="@{/task/edit/{id}(id=${task.id})}" title="Редагувати" class="p-2 bg-slate-700/50 text-slate-400 hover:bg-slate-600 hover:text-white rounded-lg transition-colors">
                            ✏️
                        </a>
                        <a th:href="@{/task/delete/{id}(id=${task.id})}" onclick="return confirm('Видалити?')" title="Видалити" class="p-2 bg-red-900/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg transition-colors">
                            🗑️
                        </a>
                    </div>
                </div>

                <div th:id="'terminal-box-' + ${task.id}" class="hidden border-t border-slate-700 bg-[#0c0c0c]">
                    <div class="flex items-center justify-between px-4 py-2 bg-slate-900/80 border-b border-slate-800">
                        <div class="flex items-center gap-4">
                            <div class="flex gap-1.5">
                                <div class="w-2.5 h-2.5 rounded-full bg-red-500/80"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-green-500/80"></div>
                            </div>
                            <span class="text-xs font-mono text-slate-500">live-log.sh</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-xs text-slate-400">Processed: <span th:id="'row-count-' + ${task.id}" class="text-green-400 font-bold font-mono">0</span></div>
                            <button th:onclick="'hideTerminal(' + ${task.id} + ')'" class="text-slate-500 hover:text-white text-xs uppercase font-bold">Close ✕</button>
                        </div>
                    </div>

                    <div th:id="'terminal-logs-' + ${task.id}"
                         class="h-64 overflow-y-auto p-4 font-mono text-xs text-slate-300 space-y-1 scroll-smooth">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Зберігаємо активні з'єднання SSE, щоб керувати ними
        const activeConnections = {};

        async function toggleRun(taskId) {
            const terminalBox = document.getElementById(`terminal-box-${taskId}`);
            const logsContainer = document.getElementById(`terminal-logs-${taskId}`);
            const btnRun = document.getElementById(`btn-run-${taskId}`);

            // Якщо вже запущено (або відкрито) - нічого не робимо, або можна реалізувати "Stop"
            if (!terminalBox.classList.contains('hidden') && activeConnections[taskId]) {
                // Вже відкрито, можливо користувач хоче закрити?
                // Поки що просто ігноруємо клік або фокусуємось
                return;
            }

            // 1. Відкриваємо термінал
            terminalBox.classList.remove('hidden');
            logsContainer.innerHTML = '<div class="text-blue-500 animate-pulse">Initializing connection...</div>';

            updateStatusBadge(taskId, 'STARTING', 'blue');
            btnRun.disabled = true;
            btnRun.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // 2. Відправляємо команду START
                const startRes = await fetch(`/api/sync/start/${taskId}`, { method: 'POST' });
                if (!startRes.ok) throw new Error("Failed to start task");

                // 3. Підключаємо SSE
                connectSSE(taskId);

            } catch (e) {
                console.error(e);
                appendLog(taskId, `❌ Error starting task: ${e.message}`, 'text-red-500');
                btnRun.disabled = false;
                btnRun.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function connectSSE(taskId) {
            // Закриваємо старе з'єднання якщо було
            if (activeConnections[taskId]) {
                activeConnections[taskId].close();
            }

            const eventSource = new EventSource(`/api/sync/stream/${taskId}`);
            activeConnections[taskId] = eventSource;

            const logsContainer = document.getElementById(`terminal-logs-${taskId}`);
            const rowCounter = document.getElementById(`row-count-${taskId}`);

            // LOG EVENT
            eventSource.addEventListener('log', (e) => {
                appendLog(taskId, e.data);
            });

            // PROGRESS EVENT
            eventSource.addEventListener('progress', (e) => {
                rowCounter.innerText = new Intl.NumberFormat('uk-UA').format(e.data);
                updateStatusBadge(taskId, 'RUNNING', 'green', true);
            });

            // HISTORY EVENT (при відкритті вже запущеної задачі)
            eventSource.addEventListener('history', (e) => {
                const state = JSON.parse(e.data);
                logsContainer.innerHTML = ''; // Clear init msg
                rowCounter.innerText = state.rowsProcessed;

                if (state.logs) {
                    state.logs.forEach(line => appendLog(taskId, line));
                }

                if (!state.running) {
                    handleFinish(taskId, state.success);
                    eventSource.close();
                    delete activeConnections[taskId];
                } else {
                    updateStatusBadge(taskId, 'RUNNING', 'green', true);
                }
            });

            // FINISHED EVENT
            eventSource.addEventListener('finished', (e) => {
                const success = e.data === 'true';
                handleFinish(taskId, success);
                eventSource.close();
                delete activeConnections[taskId];
            });

            eventSource.onerror = (e) => {
                if (eventSource.readyState === EventSource.CLOSED) return;
                appendLog(taskId, "⚠️ Connection lost. Retrying...", "text-yellow-500");
                updateStatusBadge(taskId, 'RECONNECTING', 'yellow', true);
            };
        }

        function handleFinish(taskId, success) {
            const btnRun = document.getElementById(`btn-run-${taskId}`);
            btnRun.disabled = false;
            btnRun.classList.remove('opacity-50', 'cursor-not-allowed');
            btnRun.innerText = '↺ Rerun';

            if (success) {
                updateStatusBadge(taskId, 'COMPLETED', 'green');
                appendLog(taskId, "🏁 Session finished successfully.", "text-green-500 font-bold border-t border-slate-700 pt-2 mt-2");
            } else {
                updateStatusBadge(taskId, 'FAILED', 'red');
                appendLog(taskId, "🛑 Session finished with errors.", "text-red-500 font-bold border-t border-slate-700 pt-2 mt-2");
            }
        }

        function hideTerminal(taskId) {
            const box = document.getElementById(`terminal-box-${taskId}`);
            box.classList.add('hidden');

            // Опціонально: можна не закривати з'єднання, щоб воно йшло фоном,
            // але для економії ресурсів при закритті вікна можна і закрити SSE, якщо задача завершена.
            // Якщо задача біжить - краще залишити, або закрити і при відкритті знову підтягнеться History.

            // Варіант: закриваємо SSE тільки якщо хочемо економити трафік
            if (activeConnections[taskId]) {
                activeConnections[taskId].close();
                delete activeConnections[taskId];
            }
        }

        function appendLog(taskId, text, colorClass = '') {
            const container = document.getElementById(`terminal-logs-${taskId}`);
            if (!container) return;

            const div = document.createElement('div');

            // Стилізація
            if (colorClass) div.className = colorClass;
            else if (text.includes('❌') || text.includes('Error')) div.className = 'text-red-400';
            else if (text.includes('✅')) div.className = 'text-green-400';
            else if (text.includes('🚀')) div.className = 'text-purple-400 font-bold mb-1';
            else if (text.includes('WARN')) div.className = 'text-yellow-400';
            else div.className = 'text-slate-300 opacity-90';

            const time = new Date().toLocaleTimeString('uk-UA');
            div.innerHTML = `<span class="text-slate-600 select-none mr-2 text-[10px]">[${time}]</span><span class="break-all">${text}</span>`;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatusBadge(taskId, text, color, pulse = false) {
            const badge = document.getElementById(`status-badge-${taskId}`);
            if (!badge) return;

            const colors = {
                'green': 'bg-green-900/30 text-green-400 border-green-900',
                'blue': 'bg-blue-900/30 text-blue-400 border-blue-900',
                'red': 'bg-red-900/30 text-red-400 border-red-900',
                'yellow': 'bg-yellow-900/30 text-yellow-400 border-yellow-900',
                'slate': 'bg-slate-700 text-slate-400 border-slate-600'
            };

            badge.className = `px-2 py-0.5 rounded text-[10px] uppercase font-bold border transition-all ${colors[color] || colors['slate']} ${pulse ? 'animate-pulse' : ''}`;
            badge.innerText = text;
        }
    </script>
</div>
</html>

<div th:fragment="content">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10">
            <h2 class="text-2xl font-bold text-blue-400">System Configuration</h2>
            <p class="text-slate-500 text-sm mt-1">Налаштування доступу до джерел даних та цільової бази</p>
        </header>

        <input type="hidden" id="initialTableName" th:value="${config.targetTableName}">

        <form th:action="@{/settings/save}" th:object="${config}" method="post" onsubmit="updateMappingJson()" class="space-y-8">

            <section class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700 shadow-xl transition-all hover:border-slate-600">
                <h2 class="text-xl font-bold mb-6 text-blue-400 flex items-center gap-3">
                    <span class="p-2 bg-blue-900/30 rounded-lg text-sm">📊</span> Google Sheets
                </h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 font-medium">Google Sheet ID</label>
                        <input type="text" th:field="*{googleSheetId}" id="googleSheetId"
                               placeholder="1BxiMVs0XRA5nFMdKvBdBAngmUU..."
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none text-gray-200 transition-all">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 font-medium">Service Account JSON Path</label>
                        <div class="flex gap-3">
                            <input type="text" th:field="*{serviceAccountKeyPath}" id="serviceAccountKeyPath" readonly
                                   class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-400 cursor-default">
                            <button type="button" onclick="openFileBrowser()"
                                    class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-bold transition-colors">📁 Browse</button>
                            <button type="button" onclick="testGoogleConnection()" id="btnTestConn"
                                    class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold flex items-center transition-all">
                                <span id="btnText">Verify</span>
                                <svg id="loader" class="hidden spinner ml-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                        <div id="connectionStatus" class="mt-4 p-4 rounded-xl text-sm hidden border animate-in fade-in slide-in-from-top-2"></div>
                    </div>
                </div>
            </section>

            <section class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700 shadow-xl transition-all hover:border-slate-600">
                <h2 class="text-xl font-bold mb-6 text-green-400 flex items-center gap-3">
                    <span class="p-2 bg-green-900/30 rounded-lg text-sm">🗄️</span> Target Database
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm text-gray-400 mb-2 font-medium">JDBC Connection URL</label>
                        <input type="text" th:field="*{targetDbUrl}" id="targetDbUrl"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none transition-all text-gray-200">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 font-medium">Username</label>
                        <input type="text" th:field="*{targetDbUser}" id="targetDbUser"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none transition-all text-gray-200">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 font-medium">Password</label>
                        <input type="password" th:field="*{targetDbPassword}" id="targetDbPassword"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none transition-all text-gray-200">
                    </div>
                </div>
                <div class="mt-6">
                    <button type="button" onclick="testDatabaseConnection()" id="btnTestDb"
                            class="px-8 py-3 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl font-bold transition-all flex items-center gap-2">
                        <span id="btnDbText">Test Connection</span>
                        <svg id="dbLoader" class="hidden spinner h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                    <div id="dbStatus" class="hidden mt-4 p-4 rounded-xl text-xs font-bold border animate-in fade-in"></div>
                </div>
            </section>

            <section class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700 shadow-xl transition-all hover:border-slate-600">
                <h2 class="text-xl font-bold mb-6 text-purple-400 flex items-center gap-3">
                    <span class="p-2 bg-purple-900/30 rounded-lg text-sm">📋</span> Target Configuration
                </h2>

                <div id="readOnlyMode" th:if="${not #strings.isEmpty(config.targetTableName)}" class="animate-in fade-in">
                    <div class="bg-gray-900/50 rounded-xl p-6 border border-gray-700/50">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="text-sm text-gray-400 uppercase tracking-wider font-bold mb-1">Обрана таблиця</h3>
                                <div class="text-2xl text-white font-mono flex items-center gap-2">
                                    <span class="text-purple-400">⚡</span>
                                    <span th:text="${config.targetTableName}"></span>
                                </div>
                            </div>
                            <button type="button" onclick="switchToEditMode()"
                                    class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-bold rounded-lg border border-slate-600 hover:text-white transition-all flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                Змінити налаштування
                            </button>
                        </div>

                        <div class="space-y-3">
                            <h3 class="text-sm text-gray-400 uppercase tracking-wider font-bold mb-3">Активний мапінг полів</h3>
                            <div id="readOnlyMappingList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="editModeWrapper" th:classappend="${not #strings.isEmpty(config.targetTableName)} ? 'hidden' : ''">

                    <div class="space-y-6">
                        <div class="flex gap-4 p-1 bg-gray-900 rounded-xl w-fit border border-gray-700">
                            <button type="button" onclick="setTableMode(false)" id="modeSelect" class="px-6 py-2 rounded-lg text-sm font-bold transition-all">Вибрати існуючу</button>
                            <button type="button" onclick="setTableMode(true)" id="modeCreate" class="px-6 py-2 rounded-lg text-sm font-bold transition-all">Створити нову</button>
                        </div>
                        <input type="hidden" th:field="*{createNewTable}" id="createNewTable">

                        <div id="selectContainer">
                            <label class="block text-sm text-gray-400 mb-2 font-medium">Оберіть таблицю</label>
                            <select th:field="*{targetTableName}" id="tableSelect" onchange="refreshMapping()"
                                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-200 outline-none focus:ring-2 focus:ring-purple-500 transition-all">
                                <option value="">Завантаження таблиць...</option>
                            </select>
                        </div>

                        <div id="createContainer" class="hidden">
                            <label class="block text-sm text-gray-400 mb-2 font-medium">Назва нової таблиці</label>
                            <input type="text" id="newTableNameInput" oninput="syncTableName(this.value)"
                                   class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-200 outline-none focus:ring-2 focus:ring-purple-500 transition-all">
                        </div>
                    </div>

                    <div id="mappingSection" class="hidden mt-8 pt-8 border-t border-slate-700 border-dashed animate-in fade-in slide-in-from-top-4">
                        <h2 class="text-xl font-bold mb-6 text-orange-400 flex items-center gap-3">
                            <span class="p-2 bg-orange-900/30 rounded-lg text-sm">🔗</span> Field Mapping
                        </h2>
                        <div id="mappingContainer" class="space-y-3"></div>
                    </div>
                </div>

                <input type="hidden" th:field="*{fieldMappingJson}" id="fieldMappingJson">
            </section>

            <div class="flex justify-end pt-4">
                <button type="submit" id="submitBtn"
                        th:text="${not #strings.isEmpty(config.targetTableName)} ? 'Save Changes' : 'Save Configuration'"
                        class="px-12 py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-black shadow-lg uppercase tracking-widest transition-all">
                    Save Configuration
                </button>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        // Отримуємо прапорець з Thymeleaf
        const hasSavedConfig = [[${not #strings.isEmpty(config.targetTableName)}]];

        document.addEventListener("DOMContentLoaded", async () => {
            if (hasSavedConfig) {
                // Якщо є збережений конфіг - показуємо його у режимі Read Only
                renderReadOnlyMapping();
            } else {
                // Якщо немає - ініціалізуємо форму редагування
                await initializeEditMode();
            }
        });

        function renderReadOnlyMapping() {
            const jsonField = document.getElementById('fieldMappingJson');
            const container = document.getElementById('readOnlyMappingList');
            if (!jsonField || !container) return;

            try {
                const mappings = JSON.parse(jsonField.value || '[]');
                if (mappings.length === 0) {
                    container.innerHTML = '<div class="text-slate-500 italic">Мапінг відсутній</div>';
                    return;
                }

                container.innerHTML = mappings.map(m => `
                    <div class="flex items-center justify-between p-3 bg-gray-800 rounded-lg border border-gray-700">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-orange-300 text-xs font-mono bg-orange-900/20 px-2 py-1 rounded">G</span>
                            <span class="text-slate-300 text-sm truncate" title="${m.sourceHeader}">${m.sourceHeader}</span>
                        </div>
                        <span class="text-slate-600 text-xs">➔</span>
                        <div class="flex items-center gap-2 overflow-hidden justify-end">
                            <span class="text-green-300 text-sm font-bold truncate" title="${m.targetColumn}">${m.targetColumn}</span>
                            <span class="text-green-300 text-xs font-mono bg-green-900/20 px-2 py-1 rounded">DB</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Error parsing mapping JSON", e);
                container.innerHTML = '<div class="text-red-400">Помилка відображення мапінгу</div>';
            }
        }

        async function switchToEditMode() {
            // Ховаємо блок перегляду
            const readOnlyMode = document.getElementById('readOnlyMode');
            if(readOnlyMode) readOnlyMode.classList.add('hidden');

            // Показуємо блок редагування
            const editModeWrapper = document.getElementById('editModeWrapper');
            if(editModeWrapper) editModeWrapper.classList.remove('hidden');

            // Ініціалізуємо дані (тягнемо таблиці з БД)
            await initializeEditMode();
        }

        async function initializeEditMode() {
            const createMode = document.getElementById('createNewTable').value === 'true';
            const savedTable = document.getElementById('initialTableName').value;
            const url = document.getElementById('targetDbUrl').value;
            const user = document.getElementById('targetDbUser').value;
            const pass = document.getElementById('targetDbPassword').value;

            setTableMode(createMode);

            if (url && user) {
                // Завантажуємо таблиці та відновлюємо вибір
                await loadDatabaseTables(url, user, pass, savedTable);

                if (createMode && savedTable) {
                    const newInput = document.getElementById('newTableNameInput');
                    if(newInput) newInput.value = savedTable;
                }

                // Активуємо мапінг (тягнемо заголовки)
                if (document.getElementById('googleSheetId').value && document.getElementById('serviceAccountKeyPath').value) {
                    await refreshMapping();
                }
            }
        }

        // --- ДАЛІ ЙДУТЬ СТАНДАРТНІ ФУНКЦІЇ БЕЗ ЗМІН ЛОГІКИ ---

        async function loadDatabaseTables(url, user, pass, selectValue = null) {
            const select = document.getElementById('tableSelect');
            if (!select) return;

            try {
                select.innerHTML = '<option>Loading...</option>'; // Show loading state
                const response = await fetch('/api/config/database/tables', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, user, password: pass })
                });
                const tables = await response.json();

                select.innerHTML = '<option value="">-- Оберіть таблицю --</option>';
                tables.forEach(table => {
                    const opt = document.createElement('option');
                    opt.value = table;
                    opt.innerText = table;
                    if (selectValue && table === selectValue) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = '<option value="">Помилка завантаження</option>';
            }
        }

        async function refreshMapping() {
            const sheetId = document.getElementById('googleSheetId').value;
            const keyPath = document.getElementById('serviceAccountKeyPath').value;
            const tableName = document.getElementById('tableSelect').value;
            const isCreate = document.getElementById('createNewTable').value === 'true';
            const mappingSection = document.getElementById('mappingSection');
            const container = document.getElementById('mappingContainer');

            // Show section only if we have necessary data
            if (!sheetId || !keyPath || (!isCreate && !tableName)) {
                if(mappingSection) mappingSection.classList.add('hidden');
                return;
            }

            if(mappingSection) mappingSection.classList.remove('hidden');
            if(container) container.innerHTML = '<div class="text-blue-400 animate-pulse text-center p-4">Завантаження структури Google та БД...</div>';

            // Reading existing JSON to preserve mapping if re-rendering
            const existingMappingRaw = document.getElementById('fieldMappingJson').value;
            let existingMapping = {};
            if (existingMappingRaw) {
                try {
                    const parsed = JSON.parse(existingMappingRaw);
                    parsed.forEach(m => existingMapping[m.sourceHeader] = m.targetColumn);
                } catch(e) {}
            }

            try {
                const hResp = await fetch(`/api/config/google-headers?sheetId=${sheetId}&keyPath=${encodeURIComponent(keyPath)}`);
                const headers = await hResp.json();

                let dbColumns = [];
                if (!isCreate) {
                    const dbResp = await fetch(`/api/config/database/columns?tableName=${tableName}&url=${encodeURIComponent(document.getElementById('targetDbUrl').value)}&user=${document.getElementById('targetDbUser').value}&password=${document.getElementById('targetDbPassword').value}`);
                    dbColumns = await dbResp.json();
                }

                if(container) {
                    container.innerHTML = "";
                    headers.forEach(header => {
                        const row = document.createElement('div');
                        row.className = "flex items-center gap-4 bg-gray-900/40 p-3 rounded-xl border border-slate-700/50";

                        const savedTarget = existingMapping[header];

                        let targetHtml = isCreate
                            ? `<input type="text" value="${savedTarget || transliterate(header)}" class="mapping-input flex-1 bg-gray-800 border-none rounded-lg px-3 py-1.5 text-xs text-orange-300" data-source="${header}">`
                            : `<select class="mapping-input flex-1 bg-gray-800 border-none rounded-lg px-3 py-1.5 text-xs text-green-300" data-source="${header}">
                                <option value="">-- Пропустити --</option>
                                ${dbColumns.map(col => `<option value="${col}" ${savedTarget === col ? 'selected' : ''}>${col}</option>`).join('')}
                            </select>`;

                        row.innerHTML = `<div class="w-1/3 text-xs text-slate-400 truncate" title="${header}">${header}</div><div class="text-slate-700">➔</div>` + targetHtml;
                        container.appendChild(row);
                    });

                    container.querySelectorAll('.mapping-input').forEach(el => el.addEventListener('change', updateMappingJson));
                    updateMappingJson();
                }
            } catch (e) {
                if(container) container.innerHTML = '<div class="text-red-500 text-center">Помилка завантаження структури</div>';
            }
        }

        function updateMappingJson() {
            const mappings = [];
            document.querySelectorAll('.mapping-input').forEach(el => {
                if (el.value) {
                    mappings.push({ sourceHeader: el.getAttribute('data-source'), targetColumn: el.value });
                }
            });
            const jsonField = document.getElementById('fieldMappingJson');
            if(jsonField) jsonField.value = JSON.stringify(mappings);
        }

        function setTableMode(isCreate) {
            const input = document.getElementById('createNewTable');
            if(input) input.value = isCreate;

            const selCont = document.getElementById('selectContainer');
            const creCont = document.getElementById('createContainer');
            if(selCont) selCont.classList.toggle('hidden', isCreate);
            if(creCont) creCont.classList.toggle('hidden', !isCreate);

            const btnCreate = document.getElementById('modeCreate');
            const btnSelect = document.getElementById('modeSelect');

            if(btnCreate && btnSelect) {
                if (isCreate) {
                    btnCreate.className = "px-6 py-2 rounded-lg text-sm font-bold bg-purple-600 text-white shadow-lg";
                    btnSelect.className = "px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white";
                } else {
                    btnSelect.className = "px-6 py-2 rounded-lg text-sm font-bold bg-purple-600 text-white shadow-lg";
                    btnCreate.className = "px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white";
                }
            }
            // Викликаємо оновлення тільки якщо ми вже в режимі редагування (інакше це може бути зайвим при старті)
            const wrapper = document.getElementById('editModeWrapper');
            if (wrapper && !wrapper.classList.contains('hidden')) {
                refreshMapping();
            }
        }

        function transliterate(word) {
            const ua = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","є":"ye","ж":"zh","з":"z","и":"y","і":"i","ї":"yi","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ь":"","ю":"yu","я":"ya"};
            return word.toLowerCase().split('').map(char => ua[char] || char).join('').replace(/[^a-z0-9_]/g, '_').replace(/_{2,}/g, '_');
        }

        function syncTableName(value) {
            const sanitized = value.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
            const input = document.getElementById('newTableNameInput');
            if(input) input.value = sanitized;

            const select = document.getElementById('tableSelect');
            if(select) {
                let opt = select.querySelector('option[data-temp="true"]');
                if (!opt) {
                    opt = document.createElement('option');
                    opt.setAttribute('data-temp', 'true');
                    select.appendChild(opt);
                }
                opt.value = sanitized;
                opt.innerText = sanitized + " (нова)";
                select.value = sanitized;
            }
            updateMappingJson();
        }

        // --- UI HELPER FUNCTIONS ---
        function updateStatus(message, classes) {
            const el = document.getElementById('connectionStatus');
            if (el) {
                el.innerHTML = message;
                el.className = `mt-4 p-4 text-xs font-bold rounded-xl border transition-all ${classes}`;
                el.classList.remove('hidden');
            }
        }
        // ... (Функції openFileBrowser, loadPath, selectFile, testGoogleConnection, testDatabaseConnection залишаються як були) ...
        // Для економії місця я їх не дублюю повністю, але вони мають бути тут.
        // Якщо потрібно - я можу надати повний файл.

        // --- ПОВТОРЕННЯ ВАЖЛИВИХ ФУНКЦІЙ UI ДЛЯ ПОВНОТИ КАРТИНИ ---

        async function openFileBrowser() {
            const modal = document.getElementById('fileModal');
            if(modal) {
                modal.classList.remove('hidden');
                await loadPath("");
            }
        }

        // (Додайте решту функцій openFileBrowser, loadPath, testGoogleConnection тощо з попереднього коду, вони не змінювались логічно)

        async function testGoogleConnection() {
            const btn = document.getElementById('btnTestConn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            if (!btn || !btnText) return;

            const path = document.getElementById('serviceAccountKeyPath').value;
            const sheetId = document.getElementById('googleSheetId').value;

            btn.disabled = true;
            if (loader) loader.classList.remove('hidden');
            btnText.innerText = 'Verify...';

            try {
                const response = await fetch('/api/config/google-sheets/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jsonPath: path, spreadsheetId: sheetId })
                });
                const result = await response.json();
                updateStatus(result.message, result.success ? "text-green-400 border-green-900 bg-green-900/10" : "text-red-400 border-red-900 bg-red-900/10");
                // Якщо ми в режимі редагування - оновлюємо мапінг
                const wrapper = document.getElementById('editModeWrapper');
                if (result.success && wrapper && !wrapper.classList.contains('hidden')) refreshMapping();
            } catch (e) { updateStatus("❌ Server error", "text-red-500 bg-red-900/10 border-red-900"); }
            finally {
                btn.disabled = false;
                if (loader) loader.classList.add('hidden');
                btnText.innerText = 'Verify';
            }
        }

        async function testDatabaseConnection() {
            const btn = document.getElementById('btnTestDb');
            const btnText = document.getElementById('btnDbText');
            const loader = document.getElementById('dbLoader');
            const url = document.getElementById('targetDbUrl').value;
            const user = document.getElementById('targetDbUser').value;
            const pass = document.getElementById('targetDbPassword').value;

            if (btnText) btnText.innerText = 'Connecting...';
            if (loader) loader.classList.remove('hidden');

            try {
                const response = await fetch('/api/config/database/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, user, password: pass })
                });
                const result = await response.json();
                const statusEl = document.getElementById('dbStatus');
                if (statusEl) {
                    statusEl.innerText = result.message;
                    statusEl.className = `mt-4 p-4 rounded-xl text-xs font-bold border ${result.success ? 'text-green-400 border-green-900 bg-green-900/10' : 'text-red-400 border-red-900 bg-red-900/10'}`;
                    statusEl.classList.remove('hidden');
                }
                // Оновлюємо таблиці (навіть якщо ми в режимі View - це підготує дані на випадок переключення)
                if (result.success) await loadDatabaseTables(url, user, pass);
            } finally {
                if (btnText) btnText.innerText = 'Test Connection';
                if (loader) loader.classList.add('hidden');
            }
        }
    </script>
</div>
